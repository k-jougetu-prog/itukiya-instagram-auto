name: WP Cache Update

# 2026-05-21: XSERVER NinjaFirewall が GitHub Actions のIPレンジを丸ごと403で
# 弾くようになったため、定期実行を停止。Mac上のlaunchd（com.itukiya.wpcache）
# に役割を移譲した。workflow_dispatch だけ残し、万一手元Macが死んでいる時の
# 緊急避難用に保持する（403になる可能性が高いことに注意）。
on:
  workflow_dispatch: # 手動実行のみ

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch WP cache
        run: python3 .github/scripts/fetch_wp.py

      - name: Commit & push if changed
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update WP cache [skip ci]"
            git push
          fi
